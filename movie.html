<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Movie Gallery</title>
    <style>
         :root {
            --background-color: #141414;
            --card-color: #1c1c1c;
            --text-color: #e5e5e5;
            --primary-color: #e50914;
            --border-color: #333;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        
        .gallery-container {
            background-color: var(--card-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }
        
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .controls label {
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .controls select {
            background-color: var(--background-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .controls select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .video-player {
            position: relative;
            padding-bottom: 56.25%;
            /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            transition: opacity 0.5s ease-in-out;
        }
        
        .video-player.fade-out {
            opacity: 0;
        }
        
        .video-player iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <h1>Movie Gallery</h1>
        <div class="controls">
            <label for="video-select">Choose a Category:</label>
            <select id="video-select">
                <option value="https://www.youtube.com/embed/xF4SLslCzcg?si=kBivKyPDqjxlvc3R">Movie</option>
                <option value="https://www.youtube.com/embed/GHKeWe9rjUc?si=bGXqr6Pxa8bvVtG2">Anime</option>
                <option value="https://www.youtube.com/embed/QJL_stMKG3U?si=YqgIwtwy4ItguQbA">Horror</option>
                <option value="https://www.youtube.com/embed/iBhpNZZ-Wwo?si=rOw0ELDtToi85jHd">Trailer</option>
            </select>

        </div>
        <div id="video-player" class="video-player">
            <iframe id="video-iframe" src="https://www.youtube.com/embed/xF4SLslCzcg?si=kBivKyPDqjxlvc3R" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen>
            </iframe>
        </div>
    </div>

    <script>
        const videoSelect = document.getElementById('video-select');
        const videoPlayer = document.getElementById('video-player');
        const iframe = document.getElementById('video-iframe');

        videoSelect.addEventListener('change', function() {
            const newSrc = this.value;

            // 1. Add fade-out class
            videoPlayer.classList.add('fade-out');

            // 2. Wait for the fade-out transition to finish
            setTimeout(() => {
                // 3. Change the video source
                iframe.src = newSrc;

                // 4. Remove the fade-out class to fade back in
                videoPlayer.classList.remove('fade-out');
            }, 500); // This duration should match the CSS transition duration
        });
    </script>
</body>

</html>
