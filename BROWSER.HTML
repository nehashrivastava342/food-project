<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>The input list attribute</h1>
    <p>the list attrtibute refers to a data list element that contain pre-defined option for an input element</p>
    <form>
        <input list="browser">
        <datalist id="browser">
            <option value="edge">
            <option value="firebox">
                <option value="chrome">
                    <option value="opera">
                        <option value="safari">
                            <input type="submit" value="submit">
        </datalist>

    </form>

</body>

</html>
