<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Input Form</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 0;
        }
        
        .form-container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        
        h1 {
            text-align: center;
            color: #1c1e21;
            margin-bottom: 1.5rem;
        }
        
        fieldset {
            border: 1px solid #dddfe2;
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        legend {
            padding: 0 0.5rem;
            font-weight: 600;
            color: #1c1e21;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #606770;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        input[type="search"],
        input[type="date"],
        input[type="time"],
        input[type="color"],
        input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        
        input[type="range"] {
            width: 100%;
        }
        
        .form-group-inline {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .form-group-inline label {
            margin-bottom: 0;
        }
        
        .btn {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        
        .btn-primary {
            background-color: #1877f2;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #166fe5;
        }
        
        .btn-secondary {
            background-color: #e4e6eb;
            color: #1c1e21;
        }
        
        .btn-secondary:hover {
            background-color: #d8dade;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <form>
            <h1>Advanced Input Form</h1>

            <fieldset>
                <legend>Personal Information</legend>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your Username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your Password">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your Email">
                </div>

                <div class="form-group">
                    <label for="roll-no">Roll No.</label>
                    <input type="number" id="roll-no" placeholder="Enter your roll.no">
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" placeholder="Enter mobile number">
                </div>
            </fieldset>

            <fieldset>
                <legend>Settings & Preferences</legend>
                <div class="form-group">
                    <label for="search">Search</label>
                    <input type="search" id="search" placeholder="search here">
                </div>

                <div class="form-group-inline">
                    <label for="color-picker">Theme Color</label>
                    <input type="color" id="color-picker" value="#1877f2">
                </div>

                <div class="form-group">
                    <label for="appointment-date">Appointment Date</label>
                    <input type="date" id="appointment-date">
                </div>

                <div class="form-group">
                    <label for="appointment-time">Appointment Time</label>
                    <input type="time" id="appointment-time">
                </div>

                <div class="form-group">
                    <label for="volume">Notification Volume</label>
                    <input type="range" id="volume" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="profile-picture">Profile Picture</label>
                    <input type="file" id="profile-picture">
                </div>
            </fieldset>

            <fieldset>
                <legend>Agreements</legend>
                <div class="form-group-inline">
                    <input type="checkbox" id="terms">
                    <label for="terms">I agree to the terms and conditions</label>
                </div>

                <div class="form-group-inline">
                    <input type="radio" id="radio-option1" name="radio-group" checked>
                    <label for="radio-option1">Subscribe to newsletter</label>
                </div>
                <div class="form-group-inline">
                    <input type="radio" id="radio-option2" name="radio-group">
                    <label for="radio-option2">Do not subscribe</label>
                </div>
            </fieldset>

            <input type="button" id="time-btn" class="btn btn-secondary" value="Show Current Time">

            <input type="submit" class="btn btn-primary" value="Submit">
        </form>
    </div>

    <script>
        document.getElementById('time-btn').addEventListener('click', function() {
            this.value = new Date().toLocaleTimeString();
        });
    </script>

</body>

</html>
