<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .img1 {
            filter: blur(2px);
        }
        
        .img2 {
            filter: brightness(4px);
        }
        
        .img3 {
            filter: contrast(200%);
        }
        
        .img4 {
            filter: drop-shadow(400%);
        }
        
        .img5 {
            filter: drop-shadow(grayscale(100%));
        }
        
        .img6 {
            filter: invert(100%);
        }
        
        .img7 {
            filter: sepia(100%);
        }
    </style>
</head>

<body>
    <h1> blur image filter </h1>
    <div class="img1">
        <img src="image copy 19.png" alt=" blur" length="200px" width="200px">
    </div>
    <div class="img2">
        <img src="image copy 19.png" alt=" brightness" length="200px" width="200px">
    </div>
    <div class="img3">
        <img src="image copy 19.png" alt="contrast" length="200px" width="200px">
    </div>
    <div class="img4">
        <img src="image copy 19.png" alt=" drop-shadow" length="200px" width="200px">
    </div>
    <div class="img5">
        <img src="image copy 19.png" alt=" grayscale" length="200px" width="200px">
    </div>
    <div class="img6">
        <img src="image copy 19.png" alt=" invert" length="200px" width="200px">
    </div>
    <div class="img7">
        <img src="image copy 19.png" alt="sepia" length="200px" width="200px">
    </div>

</body>

</html>
