<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .relative {
            position: relative;
            background-color: rgb(142, 255, 127);
            border: 3px solid black;
        }
        
        .absolute {
            background-color: bisque;
            position: absolute;
            top: 150px;
            left: 300px;
            bottom: 100px;
            border: 3px solid black;
            position: fixed;
        }
    </style>
</head>

<body>

    <div class="relative">hello position1</div>
    <div class="absolute">hello position2</div>
</body>

</html>
